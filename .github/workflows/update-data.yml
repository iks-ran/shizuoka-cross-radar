name: Update generated data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-generated-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORMATION_SOURCE: ${{ vars.FORMATION_SOURCE || 'fixture' }}
      OPERATION_REVISION: ${{ vars.OPERATION_REVISION || '202603' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Update static train snapshots
        run: >-
          python -m scripts.update_data
          --source "$FORMATION_SOURCE"
          --operation-revision "$OPERATION_REVISION"

      - name: Backfill missing historical snapshots
        if: env.FORMATION_SOURCE != 'fixture'
        run: python -m scripts.backfill_history

      - name: Validate generated data
        run: python -m scripts.validation

      - name: Commit valid changes
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No generated-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update current train snapshots"
          git push
